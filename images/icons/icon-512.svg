<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
    <defs>
        <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141c17" />
            <stop offset="50%" stop-color="#090e0b" />
            <stop offset="100%" stop-color="#050806" />
        </linearGradient>
        <linearGradient id="pwaLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ccff00" />
            <stop offset="50%" stop-color="#00e5ff" />
            <stop offset="100%" stop-color="#e82127" />
        </linearGradient>
        <filter id="pwaNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="pwaShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
        </filter>
    </defs>
    <!-- Background Canvas with rounded luxury feel -->
    <rect width="512" height="512" rx="112" fill="url(#pwaBgGrad)" />
    <!-- Subtle perimeter rim glow -->
    <rect x="6" y="6" width="500" height="500" rx="106" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none" />
    <circle cx="256" cy="240" r="190" fill="radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%)" />
    
    <!-- Central Aerospace Emblem -->
    <g transform="translate(256, 230) scale(3.2)" filter="url(#pwaShadow)">
        <g transform="translate(-40, -40)">
            <!-- Outer faceted hex ring -->
            <polygon points="40,5 72,24 72,56 40,75 8,56 8,24" stroke="url(#pwaLogoGrad)" stroke-width="3" fill="#101720" opacity="0.95" />
            <!-- Inner aerodynamic wing chevron -->
            <path d="M40,16 L60,32 L40,64 L20,32 Z" fill="url(#pwaLogoGrad)" filter="url(#pwaNeonGlow)" />
            <!-- Central energy core -->
            <circle cx="40" cy="38" r="5" fill="#ffffff" />
            <!-- Orbiting quantum dots -->
            <circle cx="40" cy="8" r="3.5" fill="#ccff00" />
            <circle cx="70" cy="54" r="3.5" fill="#00e5ff" />
            <circle cx="10" cy="54" r="3.5" fill="#e82127" />
        </g>
    </g>

    <!-- App Brand Name Below Emblem -->
    <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" letter-spacing="6" fill="#ffffff">
        AVIX <tspan fill="#ccff00">TREIMS</tspan>
    </text>
    <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#64748b">
        DIGITAL ASSETS
    </text>
</svg>
