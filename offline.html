<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Avix Treims - Offline Mode</title>
    <meta name="theme-color" content="#090e0b">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icons/icon-192.png">
    <style>
        :root {
            --bg-dark: #090e0b;
            --primary: #00b074;
            --accent-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            user-select: none;
        }
        .offline-card {
            background: #131b16;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .offline-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .offline-icon-wrap svg {
            width: 40px;
            height: 40px;
            stroke: var(--accent-cyan);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-retry {
            background: var(--primary);
            color: #ffffff;
            border: none;
            outline: none;
            padding: 14px 32px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0, 176, 116, 0.35);
            transition: transform 0.2s, background 0.2s;
        }
        .btn-retry:active {
            transform: scale(0.98);
            background: #009963;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            font-size: 0.8rem;
            color: #f59e0b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon-wrap">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.5 10.5a6 6 0 00-6.7 1.8M12 6a14.9 14.9 0 017.3 1.9M15.5 15.5A6 6 0 0113.5 18M12 12h.01M6.5 6.5A14.9 14.9 0 002 8.7" />
            </svg>
        </div>
        <h1>Offline Mode</h1>
        <p>You are currently offline. Check your mobile connection or WiFi to refresh real-time market data and balances.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Retry Connection
        </button>
        <div class="status-badge">
            <span class="dot"></span>
            <span>App Standalone Active</span>
        </div>
    </div>
</body>
</html>
